<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Studio capture</title>
    <style>
      html, body, #root { margin: 0; width: 100%; height: 100%; background: #05060a; overflow: hidden; }
      body { font-family: "Space Grotesk Variable", system-ui, sans-serif; color: #eef1ff; }
      .center { width: 100%; height: 100%; display: grid; place-items: center;
        background: radial-gradient(circle at 50% 40%, #171a33, #05060a 70%); }
      .id { height: 100%; padding: 22px; display: flex; flex-direction: column; justify-content: space-between; box-sizing: border-box; }
      .id small { font: 500 10px/1.4 ui-monospace, monospace; letter-spacing: .14em; text-transform: uppercase; color: #9aa4d8; }
      .id strong { font-size: 30px; font-weight: 600; letter-spacing: -.02em; line-height: 1; }
      .forme-shader-caption { display: none !important; }
      .center .forme-shutter { transform: scale(2.2); }
      .center .forme-holo { zoom: 1.5; }
      .chip { width: 46px; height: 34px; border-radius: 6px; background: linear-gradient(135deg, #f6d27a, #9c7a2c); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./capture.tsx"></script>
  </body>
</html>
