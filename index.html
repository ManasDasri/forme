<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f9fc" />
    <script>
      (() => {
        let saved;
        try {
          saved = localStorage.getItem("forme-theme");
        } catch {}
        document.documentElement.dataset.theme =
          saved === "dark" || saved === "light"
            ? saved
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
      })();
    </script>
    <meta
      name="description"
      content="Thoughtfully animated React components for distinctive brand websites. Explore the Editorial collection by Forme."
    />
    <meta
      property="og:title"
      content="Forme — Give the web a little feeling."
    />
    <meta
      property="og:description"
      content="A motion component studio for independent designers and ambitious studios."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Forme — Motion with a point of view</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
