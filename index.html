<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <script>
      (() => {
        let saved;
        try {
          saved = localStorage.getItem("forme-theme");
        } catch {}
        document.documentElement.dataset.theme =
          saved === "dark" || saved === "light" ? saved : "dark";
      })();
    </script>
    <meta
      name="description"
      content="Shaders, ASCII, live instruments, and buttons for React. Install the source with one command."
    />
    <meta property="og:title" content="Forme – Components for interfaces that feel alive" />
    <meta
      property="og:description"
      content="React components for interfaces that feel alive, with accessibility checks you can audit."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Forme – Components for interfaces that feel alive</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
