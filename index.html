<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05060a" />
    <script>
      (() => {
        let saved;
        try {
          saved = localStorage.getItem("forme-theme");
        } catch {}
        document.documentElement.dataset.theme =
          saved === "dark" || saved === "light" ? saved : "dark";
      })();
    </script>
    <meta
      name="description"
      content="Futuristic React components: shaders, HUD instruments, ASCII worlds, and buttons that react. Install the source with one command."
    />
    <meta property="og:title" content="Forme — Interfaces from the near future." />
    <meta
      property="og:description"
      content="Futuristic React components with verified accessibility behavior. Signal, the first drop."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Forme — Interfaces from the near future.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
