<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090b" />
    <script>
      (() => {
        let saved;
        try {
          saved = localStorage.getItem("forme-theme");
        } catch {}
        document.documentElement.dataset.theme =
          saved === "dark" || saved === "light" ? saved : "dark";
      })();
    </script>
    <meta
      name="description"
      content="Experimental buttons, interactive shaders, and ASCII components for React. Explore the first Forme drop."
    />
    <meta property="og:title" content="Forme — The future looks interactive." />
    <meta
      property="og:description"
      content="Experimental React buttons, interactive shaders, and ASCII art. Explore the first Forme drop."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Forme — The future looks interactive.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
